name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        gemfile: [Gemfile, gemfiles/rack_2.gemfile, gemfiles/jwt_3.gemfile]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
      # The issuing half of the pair, for the interop specs. jwt_auth_client
      # pins jwt ~> 2.8, so the jwt 3 leg runs without it (the specs skip).
      JWT_AUTH_CLIENT_PATH: ${{ matrix.gemfile == 'gemfiles/jwt_3.gemfile' && '/nonexistent' || format('{0}/vendor/jwt_auth_client', github.workspace) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danielefrisanco/jwt_auth_client
          path: vendor/jwt_auth_client
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop
